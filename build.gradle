plugins {
    id 'java'
}

group = 'org.omegat.plugins'
version = '1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
    maven { url 'https://dl.cloudsmith.io/public/omegat-org/maven/maven/' }
}

dependencies {
    compileOnly 'org.omegat:omegat:6.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    archiveBaseName.set('MTUOC-LLM-Lite')
    manifest {
        attributes(
            'OmegaT-Plugins': 'org.omegat.plugins.machinetranslators.MTUOCLLMLite',
            'Plugin-Name': 'MTUOC-LLM-Lite',
            'Plugin-Version': project.version,
            'Plugin-Author': 'MTUOC'
        )
    }
}
